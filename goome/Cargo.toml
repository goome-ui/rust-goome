[package]
name = "goome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Overlays on top of everything, normal desktop apps, or ui inside your game. Safe Rust for goome"
documentation = "https://docs.rs/goome"
readme = "README.md"
keywords = ["overlay", "gui", "immediate-mode", "ui", "goome"]
categories = ["gui", "graphics"]
include = ["src/**", "examples/**", "README.md", "LICENSE"]

[dependencies]
goome-sys = { version = "0.5.6", path = "../goome-sys" }

[dev-dependencies]
goome-ref = { path = "../goome-ref" }
